<!doctype html><html lang="ja" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>甲4の森</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: one narrow phone-first column; forest scene on top, then today's task, then tools. */
:root{
  --bg:#EDF1E8; --surface:#F8FAF4; --ink:#1E3328; --muted:#5E7266; --line:#CCD8CB;
  --pine:#2F6B4A; --pine-2:#4E8E62; --leaf:#7DB36B; --trunk:#7A5A3E; --ground:#C9D9B8; --sky:#DCE9DD;
  --alarm:#C8372D; --alarm-soft:#F6DDD9; --ok:#2F7D4F; --ok-soft:#DCEFE1; --gold:#B8862B;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1C16; --surface:#16261E; --ink:#E4EEE6; --muted:#97AC9F; --line:#2A3F33;
  --pine:#5FA77A; --pine-2:#3F7D58; --leaf:#6FA35E; --trunk:#8D6A4A; --ground:#1F3527; --sky:#14261D;
  --alarm:#E8584D; --alarm-soft:#3A1F1C; --ok:#5DBB83; --ok-soft:#173526; --gold:#D9A64A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1C16; --surface:#16261E; --ink:#E4EEE6; --muted:#97AC9F; --line:#2A3F33;
  --pine:#5FA77A; --pine-2:#3F7D58; --leaf:#6FA35E; --trunk:#8D6A4A; --ground:#1F3527; --sky:#14261D;
  --alarm:#E8584D; --alarm-soft:#3A1F1C; --ok:#5DBB83; --ok-soft:#173526; --gold:#D9A64A; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--alarm);outline-offset:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-size:26px;font-weight:900;color:var(--pine)}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.count{text-align:right;font-family:var(--display)}
.count b{font-size:30px;color:var(--alarm);font-variant-numeric:tabular-nums;line-height:1}
.count span{display:block;font-size:11px;color:var(--muted)}
.scene{border-radius:18px;overflow:hidden;background:var(--sky);border:1px solid var(--line)}
.scene svg{display:block;width:100%;height:auto}
.scene .meta{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;font-size:12px;color:var(--muted);background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.scene .meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.today{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.today .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.today h2{font-size:18px}
.prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pine);border-radius:99px;transition:width .4s}
.big{width:100%;padding:14px;border:0;border-radius:14px;background:var(--pine);color:var(--surface);font-family:var(--display);font-weight:700;font-size:17px}
.big:hover{filter:brightness(1.07)}
.sub{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 11px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--pine);color:var(--surface);border-color:var(--pine)}
.sect h3{font-size:15px;margin-bottom:8px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile:hover{border-color:var(--pine)}
.tile b{font-family:var(--display);font-size:15px}
.tile small{color:var(--muted);font-size:11.5px;line-height:1.45}
.tile .bar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
.tile .bar i{display:block;height:100%;background:var(--leaf)}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.tile.exam{border-color:var(--alarm)}
.tile.exam b{color:var(--alarm)}
.weight{white-space:nowrap;font-size:11px;font-weight:700;color:var(--alarm);background:var(--alarm-soft);border-radius:6px;padding:0 6px;align-self:flex-start}
.note{font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;color:var(--muted)}
.week div i{display:block;height:34px;border-radius:8px;background:var(--line);margin-bottom:3px;position:relative}
.week div i[data-l="1"]{background:var(--leaf);opacity:.45}
.week div i[data-l="2"]{background:var(--leaf);opacity:.75}
.week div i[data-l="3"]{background:var(--pine)}
.week div i em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums;font-size:11px}
.stats{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.kpis div{display:flex;flex-direction:column;border-left:3px solid var(--leaf);padding-left:10px;min-width:0}
.kpis span{font-size:12px;color:var(--muted)}
.kpis b{font-family:var(--display);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.kpis b em,.kpis b{font-style:normal}
.kpis b em{font-size:26px;color:var(--pine)}
.kpis b>small{font-size:13px;margin-left:1px}
.kpis b:not(:has(em)){font-size:26px;color:var(--pine)}
.kpis b:not(:has(em)) small{color:var(--ink)}
.chartbox svg{display:block;width:100%;height:auto;font-family:var(--body)}
.prow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.legend b{font-variant-numeric:tabular-nums}
.rtable.cat td:nth-child(2){width:38%}
.mini{display:block;height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.mini i{display:block;height:100%}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:11.5px}
/* quiz */
.quiz{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:10px}
.qhead .x{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 10px;font-size:13px}
.qhead .prog{flex:1}
.qhead .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.tag{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
.tag span{border-radius:6px;padding:1px 7px;background:var(--bg);color:var(--muted)}
.tag .new{background:var(--alarm-soft);color:var(--alarm);font-weight:700}
.qtext{font-size:16.5px;line-height:1.85;margin:0}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 0;font-family:var(--display);font-size:34px;font-weight:900;line-height:1.2}
.ox .o{color:var(--ok)} .ox .x{color:var(--alarm)}
.ox button:hover:not(:disabled){border-color:var(--ink)}
.mc{display:flex;flex-direction:column;gap:8px}
.mc button{display:flex;gap:10px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.6}
.mc button b{font-family:var(--display);color:var(--muted);flex:none}
.mc button:hover:not(:disabled){border-color:var(--ink)}
button.right{border-color:var(--ok)!important;background:var(--ok-soft)!important}
button.wrong{border-color:var(--alarm)!important;background:var(--alarm-soft)!important}
button:disabled{cursor:default}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--ok-soft)} .fb.bad{background:var(--alarm-soft)}
.fb h3{font-size:17px}
.fb.good h3{color:var(--ok)} .fb.bad h3{color:var(--alarm)}
.fb p{margin:0;font-size:14px;white-space:pre-line}
.fb .src{font-size:11px;color:var(--muted)}
.fig{color:#1A1A1A;background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:center}
.fig svg{display:block;width:100%;max-width:360px;height:auto}
.mc.pics{display:grid;grid-template-columns:1fr 1fr}
.mc.pics button{justify-content:center;align-items:center;flex-direction:column;gap:2px;padding:6px;color:#1A1A1A;background:#FFFFFF}
.mc.pics button svg{width:100%;max-width:130px;height:auto}
.sa{display:flex;flex-direction:column;gap:10px}
.sa .ans{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;white-space:pre-line;font-size:14.5px}
.sa .self{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sa .self button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 0;font-family:var(--display);font-weight:700;font-size:15px}
.sa .self .o{color:var(--ok)} .sa .self .x{color:var(--alarm)}
.reveal{border:2px solid var(--pine);background:var(--surface);color:var(--pine);border-radius:14px;padding:11px 0;font-family:var(--display);font-weight:700;font-size:15px}
.lv{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.lv .badge{flex:none;width:52px;height:52px;border-radius:14px;background:var(--pine);color:#fff;display:grid;place-items:center;font-family:var(--display);line-height:1}
.lv .badge b{font-size:22px}.lv .badge small{font-size:10px;display:block}
.lv .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lv .info strong{font-family:var(--display);font-size:16px}
.lv .xpbar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.lv .xpbar i{display:block;height:100%;background:var(--gold)}
.ach{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ach div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:10.5px;line-height:1.35;color:var(--muted)}
.ach div span{display:block;font-size:24px;filter:grayscale(1);opacity:.35}
.ach div.got{border-color:var(--gold);color:var(--ink)}.ach div.got span{filter:none;opacity:1}
.combo{font-family:var(--display);font-weight:900;color:var(--gold);font-size:13px;white-space:nowrap}
.gain{font-family:var(--display);font-weight:700;color:var(--gold);font-size:13px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1E3328;color:#fff;border-radius:14px;padding:10px 16px;font-family:var(--display);font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:9;text-align:center;max-width:90vw;animation:pop .3s ease-out both}
.timer{height:10px;border-radius:9px;background:var(--line);overflow:hidden;flex:1}.timer i{display:block;height:100%;background:var(--alarm);transition:width .25s linear}
.flash-ok{box-shadow:0 0 0 3px var(--ok) inset}.flash-ng{box-shadow:0 0 0 3px var(--alarm) inset}
.next{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.result{display:flex;flex-direction:column;gap:14px;text-align:center}
.result .score{font-family:var(--display);font-size:46px;font-weight:900;color:var(--pine);font-variant-numeric:tabular-nums;line-height:1.1}
.rtable{width:100%;border-collapse:collapse;font-size:14px;text-align:left}
.rtable td,.rtable th{padding:7px 4px;border-bottom:1px solid var(--line)}
.rtable td:last-child,.rtable th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--alarm);font-weight:700}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm button:not(.linkbtn){border:1px solid var(--alarm);color:var(--alarm);background:transparent;border-radius:8px;padding:2px 10px;font-size:12px}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.anim{animation:pop .35s ease-out both;transform-box:fill-box;transform-origin:bottom center}
@media (prefers-reduced-motion:reduce){.anim{animation:none}.prog i{transition:none}}
</style>

<div class="wrap" id="app"></div>

<script>
function __boot(ITEMS){
const CATS = {
  hourei1:{name:'法令（共通）', short:'法令共通', w:'本番8問', sub:'防火対象物・防火管理者・届出・点検・免状'},
  hourei4:{name:'法令（4類）', short:'法令4類', w:'本番7問', sub:'自火報・ガス漏れの設置義務、省略規定'},
  kikaku:{name:'構造・機能（規格）', short:'規格', w:'本番8問', sub:'受信機・感知器・発信機・中継器の規格'},
  secchi:{name:'設置基準・工事', short:'設置基準', w:'実技・製図の土台', sub:'警戒区域、感知器の高さ・距離、配線'},
  shiken:{name:'試験・点検', short:'試験点検', w:'鑑別の土台', sub:'作動試験・流通試験・回路導通試験'},
  kanbetsu:{name:'鑑別（図で答える）', short:'鑑別', w:'実技5問', sub:'感知器・試験器・工具・測定器の図'},
  seizu:{name:'製図（図記号・平面図・系統図）', short:'製図', w:'実技2問', sub:'図記号、感知器の個数、幹線の本数'},
  denki:{name:'電気の基礎（免除科目）', short:'電気', w:'免除・任意', sub:'オームの法則・交流・計器。今日の学習には出ません'}
};
const CAT_ORDER = ['hourei1','hourei4','kikaku','secchi','shiken','kanbetsu','seizu','denki'];
const TREE_CATS = CAT_ORDER.filter(c=>c!=='denki');
const WRITTEN = ['hourei1','hourei4','kikaku','secchi','shiken'], PRACTICAL = ['kanbetsu','seizu'];
const EXAM = new Date(2027,0,11);
const INTERVALS = [0,1,2,4,7,15,30];
const BYID = Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const LSKEY = 'k4mori-v1';

function dayNum(d=new Date()){return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(2026,0,1))/864e5)}
function dayKey(n){const d=new Date(2026,0,1+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const TODAY = dayNum();

let S = blank();
function blank(){return {v:2,cards:{},log:{},time:{},goal:20,tgoal:30,cats:WRITTEN.concat(PRACTICAL),total:0,updated:0}}

// ---------- storage: cloud (db) with local mirror ----------
let ref=null, syncState='local', saving=false, pending=false, saveTimer=null;
function loadLocal(){try{const t=localStorage.getItem(LSKEY);return t?JSON.parse(t):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}
function adopt(x){if(x&&x.cards){S=Object.assign(blank(),x); S.time=S.time||{}; if(!(S.v>=2)){S.cats=WRITTEN.concat(PRACTICAL); S.v=2;} if(S.xp==null){let x=0;Object.values(S.cards).forEach(c=>{x+=c.ok*10+c.ng*2});S.xp=x;}}}
adopt(loadLocal());
function persist(){
  S.updated=Date.now(); saveLocal();
  if(!ref) return;
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,1200);
}
async function flush(){
  if(!ref) return;
  if(saving){pending=true;return}
  saving=true; setSync('saving');
  try{await ref.set(JSON.parse(JSON.stringify(S))); setSync('cloud')}catch(e){setSync('error')}
  saving=false; if(pending){pending=false; flush()}
}
function setSync(s){syncState=s; const el=document.getElementById('sync'); if(el) el.textContent=syncLabel()}
function syncLabel(){return {local:'この端末に保存',saving:'クラウドに保存中…',cloud:'クラウドに保存済み',error:'クラウド保存に失敗（この端末には保存済み）'}[syncState]}
(async()=>{
  try{
    if(!window.claude||!claude.use) return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    ref=db.doc('data/users/'+uid+'/progress');
    const snap=await ref.get();
    if(snap.exists){const x=snap.data(); if(x&&(x.updated||0)>(S.updated||0)){adopt(x); saveLocal(); if(view==='home') render();}}
    if(!snap.exists||(S.updated||0)>((snap.data()||{}).updated||0)) flush(); else setSync('cloud');
  }catch(e){ref=null;setSync('local')}
})();

// ---------- spaced repetition ----------
function card(id){return S.cards[id]||(S.cards[id]={b:0,d:0,ok:0,ng:0})}
function isNew(id){const c=S.cards[id];return !c||(c.ok+c.ng)===0}
function isDue(id){const c=S.cards[id];return c&&(c.ok+c.ng)>0&&c.d<=TODAY}
function mastered(id){const c=S.cards[id];return c&&c.b>=4}
function grade(id,correct){
  const c=card(id);
  if(correct){c.ok++; c.b=Math.min(c.b+1,6); c.d=TODAY+INTERVALS[c.b];}
  else{c.ng++; c.b=1; c.d=TODAY+1;}
  S.log[dayKey(TODAY)]=(S.log[dayKey(TODAY)]||0)+1; S.total=(S.total||0)+1;
  persist();
}
function todayCount(){return S.log[dayKey(TODAY)]||0}
// ---------- ゲーム要素：経験値・レベル・称号・実績 ----------
const TITLES=[[1,'見習い'],[3,'点検補助'],[6,'点検員'],[10,'設備係'],[15,'設備主任'],[20,'防災センター長'],[25,'甲4マスター'],[30,'伝説の消防設備士']];
function lvFromXp(x){let L=1;while(25*L*(L+1)<=x)L++;return L}
function xpAt(L){return 25*L*(L-1)}
function titleOf(L){let t=TITLES[0][1];TITLES.forEach(([l,n])=>{if(L>=l)t=n});return t}
function okCount(cats){let n=0;ITEMS.forEach(i=>{if(!cats||cats.includes(i.c)){const c=S.cards[i.id];if(c)n+=c.ok}});return n}
const ACH=[
 ['first','🌱','はじめの一問',()=>(S.total||0)>=1],
 ['q100','📘','100問解いた',()=>(S.total||0)>=100],
 ['q500','📚','500問解いた',()=>(S.total||0)>=500],
 ['q1000','🏛️','1000問解いた',()=>(S.total||0)>=1000],
 ['c10','🔥','10連続正解',()=>(S.maxCombo||0)>=10],
 ['c25','💥','25連続正解',()=>(S.maxCombo||0)>=25],
 ['s3','📅','3日連続',()=>streak()>=3],
 ['s7','🗓️','7日連続',()=>streak()>=7],
 ['s30','🌳','30日連続',()=>streak()>=30],
 ['goal','🎯','今日の目標達成',()=>todayCount()>=S.goal],
 ['fig50','🔍','図の問題50問正解',()=>okCount(['kanbetsu','seizu'])>=50],

let toastQ=[],toastOn=false;
function toast(msg){toastQ.push(msg);if(!toastOn)showToast()}
function showToast(){const m=toastQ.shift();if(!m){toastOn=false;return}toastOn=true;const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;document.body.appendChild(d);setTimeout(()=>{d.remove();showToast()},2300)}
function unlock(key){S.ach=S.ach||{};if(!S.ach[key]){S.ach[key]=dayKey(TODAY);const a=ACH.find(x=>x[0]===key);if(a)toast(a[1]+' 実績「'+a[2]+'」を達成！');persist()}}
function checkAch(){ACH.forEach(([k,,,f])=>{try{if(f())unlock(k)}catch(e){}})}
function gainXp(ok,combo){
  const before=lvFromXp(S.xp||0); const g=ok?10+Math.min(Math.max(combo-1,0),10):2;
  S.xp=(S.xp||0)+g; const after=lvFromXp(S.xp);
  if(after>before) toast('🎉 レベル'+after+'！ 称号「'+titleOf(after)+'」');
  if(new Date().getHours()<7) unlock('early');
  checkAch(); return g;
}
function streak(){let n=0,d=TODAY; if(!S.log[dayKey(d)]) d--; while(S.log[dayKey(d)]){n++;d--} return n}

let lastT=null;
function tick(){const now=Date.now(); if(lastT!=null&&view==='quiz'){const k=dayKey(dayNum()); S.time[k]=(S.time[k]||0)+Math.min(now-lastT,120000)/1000;} lastT=now}

function studyDays(){return Object.keys(S.log).filter(k=>S.log[k]>0).length}
function totalSec(){return Object.values(S.time||{}).reduce((a,b)=>a+b,0)}
function fmtHM(sec){const m=Math.round(sec/60);return m<60?m+'分':Math.floor(m/60)+'時間'+(m%60?(m%60)+'分':'')}
function catIds(c){return ITEMS.filter(i=>i.c===c).map(i=>i.id)}
function catScore(c){const ids=catIds(c);let s=0;ids.forEach(id=>{const x=S.cards[id];if(x)s+=Math.min(x.b,4)});return s/(4*ids.length)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newOrder(cats){
  // 法令と規格を交互に → 次に設置基準 → 試験。各分野の中は教材の順。
  // 筆記（法令・規格・設置・試験）を交互に出し、4問に1問は実技（鑑別・製図を交互）を混ぜる。
  const enabled=cats||S.cats;
  const wl=WRITTEN.concat(['denki']).filter(c=>enabled.includes(c)).map(c=>catIds(c).filter(isNew));
  const pl=PRACTICAL.filter(c=>enabled.includes(c)).map(c=>catIds(c).filter(isNew));
  const out=[]; let wi=0, pi=0, n=0;
  const take=(ls,k)=>{for(let t=0;t<ls.length;t++){const l=ls[(k+t)%ls.length]; if(l.length) return [l.shift(),(k+t+1)%ls.length]} return [null,k]};
  while(wl.some(l=>l.length)||pl.some(l=>l.length)){
    let id=null;
    if((n%4===3||!wl.some(l=>l.length)) && pl.some(l=>l.length)){[id,pi]=take(pl,pi)}
    else {[id,wi]=take(wl,wi)}
    if(id) out.push(id); n++;
  }
  return out;
}
function dueList(cats){return ITEMS.filter(i=>(cats||S.cats).includes(i.c)&&isDue(i.id)).map(i=>i.id).sort((a,b)=>S.cards[a].d-S.cards[b].d||S.cards[a].b-S.cards[b].b)}
function todayQueue(){
  const left=Math.max(S.goal-todayCount(),5);
  const due=dueList().slice(0,left); const fresh=newOrder().slice(0,left-due.length);
  return shuffle(due.concat(fresh));
}

function timeChart(){
  const W=340,H=176,L=34,R=8,T=24,B=26, n=7;
  const mins=[];for(let k=6;k>=0;k--) mins.push((S.time[dayKey(TODAY-k)]||0)/60);
  const goal=S.tgoal||30, top=Math.max(goal*1.15, ...mins, 10);
  const step=top>120?60:top>60?30:top>30?15:10;
  const ymax=Math.ceil(top/step)*step, y=v=>T+(H-T-B)*(1-v/ymax), bw=(W-L-R)/n;
  let g='';
  for(let v=0;v<=ymax;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`}
  mins.forEach((m,i)=>{const x=L+i*bw+bw*0.2,w=bw*0.6,h=Math.max(y(0)-y(m),m>0?2:0);const d=new Date(2026,0,1+TODAY-6+i);
    g+=`<rect x="${x}" y="${y(0)-h}" width="${w}" height="${h}" rx="3" fill="${m>=goal?'var(--pine)':'var(--leaf)'}"/>`;
    if(m>=1) g+=`<text x="${x+w/2}" y="${y(0)-h-4}" text-anchor="middle" font-size="9.5" fill="var(--ink)">${Math.round(m)}</text>`;
    g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="${i===6?'var(--ink)':'var(--muted)'}" font-weight="${i===6?700:400}">${i===6?'今日':(d.getMonth()+1)+'/'+d.getDate()}</text>`});
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--alarm)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  g+=`<text x="${W-R}" y="${y(goal)-5}" text-anchor="end" font-size="10" fill="var(--alarm)" font-weight="700">目標 ${fmtHM(goal*60)}</text>`;
  g+=`<text x="${L-6}" y="10" text-anchor="end" font-size="9" fill="var(--muted)">（分）</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直近7日の学習時間（分）">${g}</svg>`;
}

function bindBackup(){

  const cp=document.getElementById('bkcopy'); if(cp) cp.onclick=()=>{const t=document.getElementById('bkout');
    const done=()=>{cp.textContent='コピーしました'};
    try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();cp.textContent='選択しました。長押しでコピーしてください'})}catch(e){t.select();cp.textContent='選択しました。長押しでコピーしてください'}};

  <div class="note">全${ITEMS.length}問：未学習 ${nNew}／学習中 ${nL}／定着 ${nM}（4回連続正解相当）。教科書の「一夜漬け○×ドリル」「模擬テスト①②」に加え、第1〜7章の内容から作った問題と、鑑別・製図の図の問題を収録。図は特徴をわかりやすくした自作の簡略図です。電気の基礎は免除前提のため、今日の学習には含めていません（上のボタンで追加できます）。</div>
  ${backupHTML()}
  <div class="foot"><span id="sync">${syncLabel()}</span>
    <span class="confirm">${confirmReset?`記録をすべて消しますか？ <button id="resetYes">消す</button><button id="resetNo" style="border-color:var(--line);color:var(--muted)">やめる</button>`:`<button class="linkbtn" id="reset">記録をリセット</button>`}</span></div>`;
  document.getElementById('go').onclick=()=>start('today',todayQueue());
  document.getElementById('weak').onclick=()=>{const q=ITEMS.filter(i=>{const c=S.cards[i.id];return c&&c.ng>0&&c.b<3}).map(i=>i.id);start('weak',shuffle(q).slice(0,20))};
  document.getElementById('exam').onclick=startExam;
  document.getElementById('exam2').onclick=startExam2;
  document.getElementById('speed').onclick=startSpeed;
  app.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const add=b.getAttribute('aria-pressed')!=='true';const cs=b.dataset.inc==='prac'?PRACTICAL:['denki'];
    S.cats=S.cats.filter(c=>!cs.includes(c)); if(add) S.cats=S.cats.concat(cs); persist(); render()});
  app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const c=b.dataset.cat;const due=dueList([c]);const fresh=newOrder([c]);let q=due.concat(fresh).slice(0,15);if(q.length<15)q=q.concat(shuffle(catIds(c).filter(id=>!q.includes(id))).slice(0,15-q.length));start('cat:'+c,q)});
  app.querySelectorAll('[data-tgoal]').forEach(b=>b.onclick=()=>{S.tgoal=+b.dataset.tgoal;persist();render()});
  app.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{S.goal=+b.dataset.goal;persist();render()});
  bindBackup();
  const r=document.getElementById('reset'); if(r) r.onclick=()=>{confirmReset=true;render()};
  const y=document.getElementById('resetYes'); if(y) y.onclick=()=>{S=blank();confirmReset=false;persist();render()};
  const n=document.getElementById('resetNo'); if(n) n.onclick=()=>{confirmReset=false;render()};
}

function start(mode,q){
  if(!q.length){q=shuffle(ITEMS.filter(i=>S.cats.includes(i.c)).map(i=>i.id)).slice(0,10)}
  sess={mode,q,i:0,answered:null,shown:false,results:[],requeued:{}};view='quiz';lastT=Date.now();render();window.scrollTo(0,0);
}
function startExam(){
  const pick=(c,n)=>shuffle(ITEMS.filter(i=>i.c===c&&i.t==='mc').map(i=>i.id)).slice(0,n);
  const q=pick('hourei1',8).concat(pick('hourei4',7),pick('kikaku',8));
  sess={mode:'exam',q,i:0,answered:null,shown:false,results:[],requeued:{}};view='quiz';lastT=Date.now();render();window.scrollTo(0,0);
}
function startExam2(){
  const pick=(f,n)=>shuffle(ITEMS.filter(f).map(i=>i.id)).slice(0,n);
  const kb=pick(i=>i.c==='kanbetsu'&&i.fig,5), sz=pick(i=>i.c==='seizu'&&i.fig&&/^f-[zy]/.test(i.id),2);
  sess={mode:'exam2',q:kb.concat(sz),i:0,answered:null,shown:false,results:[],requeued:{}};view='quiz';lastT=Date.now();render();window.scrollTo(0,0);
}
function isExam(m){return m==='exam'||m==='exam2'}
function startSpeed(){
  const pool=ITEMS.filter(i=>i.t==='ox'&&S.cats.includes(i.c));
  const seen=shuffle(pool.filter(i=>!isNew(i.id)).map(i=>i.id)), fresh=shuffle(pool.filter(i=>isNew(i.id)).map(i=>i.id));
  const q=seen.concat(fresh).slice(0,120);
  sess={mode:'speed',q,i:0,answered:null,shown:false,results:[],requeued:{},combo:0,end:Date.now()+60000};view='quiz';lastT=Date.now();render();window.scrollTo(0,0);
  sess.timer=setInterval(()=>{const left=Math.max(0,sess.end-Date.now());const t=document.getElementById('tleft');const b=document.getElementById('tbar');
    if(t)t.textContent=Math.ceil(left/1000)+'秒';if(b)b.style.width=(left/600)+'%';if(left<=0){tick();persist();endSession()}},250);
}
function label(mode){return mode==='today'?'今日の学習':mode==='weak'?'苦手だけ':mode==='exam'?'本番形式の模試（筆記）':mode==='exam2'?'本番形式の模試（実技）':mode==='speed'?'スピードチャレンジ':CATS[mode.slice(4)].name}

function renderQuiz(){
  const id=sess.q[sess.i], it=BYID[id], a=sess.answered, exam=isExam(sess.mode);
  const fresh=isNew(id)&&!exam;
  let opts='';
  if(it.t==='ox'){
    opts=`<div class="ox"><button class="o ${a!=null?(it.a===1?'right':a===1?'wrong':''):''}" data-v="1" ${a!=null?'disabled':''} aria-label="正しい（○）">○</button><button class="x ${a!=null?(it.a===0?'right':a===0?'wrong':''):''}" data-v="0" ${a!=null?'disabled':''} aria-label="誤り（×）">×</button></div>`;
  }else if(it.t==='sa'){
    opts=`<div class="sa">${!sess.shown?`<button class="reveal" id="reveal">答えを見る</button>`:`<div class="ans"><b>答え</b>\n${esc(it.ans)}</div>
      ${a==null?`<div class="sub">自分の答えと比べて、合っていたかを選んでください。</div><div class="self"><button class="o" data-v="1">できた</button><button class="x" data-v="0">まちがえた</button></div>`:''}`}</div>`;
  }else{
    const pics=it.ch.some(c=>String(c).startsWith('<svg'));
    opts=`<div class="mc${pics?' pics':''}">${it.ch.map((c,k)=>`<button data-v="${k}" ${a!=null?'disabled':''} class="${a!=null?(it.a===k?'right':a===k?'wrong':''):''}"><b>${'①②③④'[k]}</b>${pics?c:`<span>${esc(c)}</span>`}</button>`).join('')}</div>`;
  }
  let fb='';
  if(a!=null&&!exam&&sess.mode!=='speed'){
    const ok=it.t==='sa'?a===1:a===it.a; const ans=it.t==='ox'?(it.a?'○（正しい）':'×（誤り）'):it.t==='sa'?(ok?'自己採点：できた':'自己採点：まちがえた'):'正解は '+'①②③④'[it.a];
    const ex=it.ex||(it.t==='ox'&&it.a?'この文のとおりです。':'');
    fb=`<div class="fb ${ok?'good':'bad'}" role="status"><h3>${ok?'正解':'不正解'}　<span style="font-size:14px">${ans}</span><span class="gain">+${sess.gain||0} XP</span></h3>${ex?`<p>${esc(ex)}</p>`:''}<span class="src">出典：教科書 ${esc(it.src)}</span></div>`;
  }
  const last=sess.i>=sess.q.length-1;
  app.innerHTML=`<div class="quiz">
    ${sess.mode==='speed'?`<div class="qhead"><button class="x" id="quit">やめる</button><div class="timer"><i id="tbar" style="width:${Math.max(0,sess.end-Date.now())/600}%"></i></div><span class="n" id="tleft">${Math.ceil(Math.max(0,sess.end-Date.now())/1000)}秒</span><span class="combo">✔ ${sess.results.filter(x=>x.ok).length}</span></div>`
    :`<div class="qhead"><button class="x" id="quit">やめる</button><div class="prog"><i style="width:${(sess.i+(a!=null?1:0))/sess.q.length*100}%"></i></div><span class="n">${sess.i+1} / ${sess.q.length}</span>${(sess.combo||0)>=3&&!exam?`<span class="combo">🔥${sess.combo}</span>`:''}</div>`}
    <article class="card">
      <div class="tag"><span>${label(sess.mode)}</span><span>${CATS[it.c].name}</span><span>${it.t==='ox'?'○×':it.t==='sa'?'記述（自己採点）':'四択'}</span>${it.fig?'<span>図</span>':''}${fresh?'<span class="new">はじめて</span>':''}</div>
      <p class="qtext">${esc(it.q)}</p>
      ${it.fig?`<div class="fig">${it.fig}</div>`:''}
      ${opts}
      ${fb}
    </article>
    ${a!=null?`<button class="big next" id="next">${last?'結果を見る':'次へ'}</button>`:''}
  </div>`;
  document.getElementById('quit').onclick=()=>{tick();lastT=null;persist();if(sess.timer){clearInterval(sess.timer);sess.timer=null}if(sess.results.length&&!isExam(sess.mode)){endSession();return}view='home';render()};
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>answer(+b.dataset.v));
  const rv=document.getElementById('reveal'); if(rv) rv.onclick=()=>{sess.shown=true;render()};
  const nx=document.getElementById('next'); if(nx){nx.onclick=next; nx.focus({preventScroll:true})}
}
function answer(v){
  if(sess.answered!=null) return;
  const id=sess.q[sess.i], it=BYID[id], ok=it.t==='sa'?v===1:v===it.a;
  tick(); sess.answered=v; sess.results.push({id,ok});
  const speed=sess.mode==='speed';
  if(!isExam(sess.mode)&&!speed){grade(id,ok); if(!ok&&!sess.requeued[id]){sess.requeued[id]=1; sess.q.splice(Math.min(sess.i+4,sess.q.length),0,id)}}
  else {grade(id,ok)}
  sess.combo=ok?(sess.combo||0)+1:0; S.maxCombo=Math.max(S.maxCombo||0,sess.combo);
  if(sess.combo>0&&sess.combo%5===0&&!isExam(sess.mode)) toast('🔥 '+sess.combo+'連続正解！');
  sess.gain=gainXp(ok,sess.combo); persist();
  if(isExam(sess.mode)){next();return}
  if(speed){render();setTimeout(()=>{if(view==='quiz'&&sess.mode==='speed')next()},ok?250:700);return}
  render();
}
function next(){
  if(sess.answered!=null&&!isExam(sess.mode)){tick();persist()}
  if(sess.i>=sess.q.length-1){endSession();return}
  sess.i++; sess.answered=null; sess.shown=false; render(); window.scrollTo(0,0);
}
function endSession(){
  if(sess.timer){clearInterval(sess.timer);sess.timer=null}
  if(sess.mode==='speed'){const n=sess.results.filter(x=>x.ok).length;sess.prevBest=S.speedBest||0;if(n>(S.speedBest||0)){S.speedBest=n}checkAch();persist()}
  lastT=null;view='result';render();window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(view!=='quiz'||e.metaKey||e.ctrlKey) return;
  const it=BYID[sess.q[sess.i]];
  if(sess.answered==null){
    if(it.t==='ox'){if(e.key==='o'||e.key==='1')answer(1);else if(e.key==='x'||e.key==='2')answer(0)}
    else if(it.t==='sa'){if(!sess.shown&&(e.key===' '||e.key==='Enter')){e.preventDefault();sess.shown=true;render()}else if(sess.shown&&e.key==='1')answer(1);else if(sess.shown&&e.key==='2')answer(0)}
    else if(['1','2','3','4'].includes(e.key)) answer(+e.key-1);
  }else if(e.key==='Enter'&&document.activeElement?.id!=='next'){next()}
});

function renderResult(){
  const r=sess.results, ok=r.filter(x=>x.ok).length;
  let body='';
  if(sess.mode==='speed'){
    const nb=ok>(sess.prevBest||0);
    body=`<div class="sub">${r.length}問に回答・正解 ${ok}問</div><h2 class="${nb?'pass':''}">${nb?'🏆 自己ベスト更新！':'自己ベスト '+(S.speedBest||0)+'問'}</h2>`;
  }
  if(sess.mode==='exam2'){
    const kb=r.filter(x=>BYID[x.id].c==='kanbetsu'), sz=r.filter(x=>BYID[x.id].c==='seizu'), tot=ok/r.length, p=tot>=.6;
    body=`<table class="rtable"><tbody><tr><td>鑑別</td><td>${kb.filter(x=>x.ok).length} / ${kb.length}</td></tr><tr><td>製図</td><td>${sz.filter(x=>x.ok).length} / ${sz.length}</td></tr>
      <tr><th>実技 合計（60%以上）</th><th class="${p?'pass':'fail'}">${Math.round(tot*100)}%</th></tr></tbody></table>
      <h2 class="${p?'pass':'fail'}">${p?'合格ライン到達':'あと少し。合格ラインに届いていません'}</h2>${p?(unlock('ex2'),''):''}
      <div class="sub">本番の実技は記述式で、鑑別と製図の配点も問題ごとに違います。ここでは1問1点の目安です。</div>`;
  }
  if(sess.mode==='exam'){
    const parts=[['法令（共通）','hourei1'],['法令（4類）','hourei4'],['構造・機能（規格）','kikaku']];
    let allPass=true; let rows='';
    const lawIds=r.filter(x=>BYID[x.id].c!=='kikaku'), kik=r.filter(x=>BYID[x.id].c==='kikaku');
    const lawRate=lawIds.filter(x=>x.ok).length/lawIds.length, kikRate=kik.filter(x=>x.ok).length/kik.length, tot=ok/r.length;
    parts.forEach(([n,c])=>{const xs=r.filter(x=>BYID[x.id].c===c);rows+=`<tr><td>${n}</td><td>${xs.filter(x=>x.ok).length} / ${xs.length}</td></tr>`});
    const p1=lawRate>=.4,p2=kikRate>=.4,p3=tot>=.6; allPass=p1&&p2&&p3; if(allPass) unlock('ex1');
    body=`<table class="rtable"><tbody>${rows}
      <tr><th>法令 計（40%以上）</th><th class="${p1?'pass':'fail'}">${Math.round(lawRate*100)}%</th></tr>
      <tr><th>規格（40%以上）</th><th class="${p2?'pass':'fail'}">${Math.round(kikRate*100)}%</th></tr>
      <tr><th>全体（60%以上）</th><th class="${p3?'pass':'fail'}">${Math.round(tot*100)}%</th></tr></tbody></table>
      <h2 class="${allPass?'pass':'fail'}">${allPass?'合格ライン到達':'あと少し。合格ラインに届いていません'}</h2>`;
  }
  const wrong=[...new Set(r.filter(x=>!x.ok).map(x=>x.id))];
  const wl=wrong.map(id=>{const it=BYID[id];const ans=it.t==='ox'?(it.a?'○':'×'):it.t==='sa'?'記述':'①②③④'[it.a]+(String(it.ch[it.a]).startsWith('<svg')?'':'（'+it.ch[it.a]+'）');return `<li style="text-align:left;margin-bottom:8px"><span class="sub">${CATS[it.c].short}・正解 ${ans}</span><br>${esc(it.q.length>90?it.q.slice(0,90)+'…':it.q)}${it.ex?`<br><span class="sub">→ ${esc(it.ex.length>120?it.ex.slice(0,120)+'…':it.ex)}</span>`:''}</li>`}).join('');
  app.innerHTML=`<div class="result">
    <h2>${label(sess.mode)}　おつかれさまでした</h2>
    ${levelHTML()}
    <div class="score">${ok}<span style="font-size:22px;color:var(--muted)"> / ${r.length}</span></div>
    <div class="scene">${forestSVG()}</div>
    ${body}
    ${wrong.length?`<details class="card" ${wrong.length<=6?'open':''}><summary style="font-family:var(--display);font-weight:700;text-align:left;cursor:pointer">間違えた問題 ${wrong.length}問（明日また出ます）</summary><ul style="padding-left:18px;margin:10px 0 0">${wl}</ul></details>`:''}
    <button class="big" id="home">森に戻る</button>
  </div>`;
  document.getElementById('home').onclick=()=>{view='home';render();window.scrollTo(0,0)};
}
render();

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openData(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(ENC.iv)},k,ub(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(msg){
  const a=document.getElementById('app');
  a.innerHTML=`<header class="top"><div class="brand"><h1>甲4の森</h1><p>消防設備士 甲種第4類・筆記／実技対策</p></div></header>
  <form class="today" id="lk"><h2>パスワードを入力</h2><div class="sub">最初の1回だけ必要です。この端末に記憶されます。</div>
  <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" style="font:inherit;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
  <button class="big" type="submit">開く</button>${msg?`<div class="sub" role="alert" style="color:var(--alarm);font-weight:700">${msg}</div>`:''}</form>`;
  document.getElementById('lk').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value.trim();
    try{const d=await openData(pw);try{localStorage.setItem('k4mori-pw',pw)}catch(_){}__boot(d)}catch(_){lockScreen('パスワードが違います')}};
}
(async()=>{let pw=null;try{pw=localStorage.getItem('k4mori-pw')}catch(_){}
  if(pw){try{__boot(await openData(pw));return}catch(_){}} lockScreen('');})();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
